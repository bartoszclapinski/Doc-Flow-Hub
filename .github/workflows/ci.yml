name: CI

on:
  push:
    branches: [ master, redesign/ide ]
  pull_request:
    branches: [ master, redesign/ide ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    # LiveStorage tests need a real Azure Storage key (local-only appsettings.Test.json).
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "Category!=LiveStorage"

  # Render deploys master only after these checks pass, so make sure the demo image builds.
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build demo image
      run: docker build -t docflowhub-demo .
