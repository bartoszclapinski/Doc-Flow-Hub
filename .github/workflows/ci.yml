name: CI

on:
  push:
    branches: [ master, redesign/ide ]
  pull_request:
    branches: [ master, redesign/ide ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    # LiveStorage tests need a real Azure Storage key (local-only appsettings.Test.json).
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "Category!=LiveStorage"

  # Render deploys master only after these checks pass, so make sure the demo image builds,
  # then run the Playwright smoke suite against that same image (the public demo setup).
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build demo image
      run: docker build -t docflowhub-demo .

    - name: Start the demo container
      run: |
        docker run -d --name demo -p 10000:10000 docflowhub-demo
        for i in $(seq 1 60); do
          if curl -fs http://localhost:10000/healthz > /dev/null; then echo "ready after ${i}s"; exit 0; fi
          sleep 1
        done
        docker logs demo
        exit 1

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tests/e2e/package-lock.json

    - name: Install Playwright
      working-directory: tests/e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Smoke tests
      working-directory: tests/e2e
      env:
        BASE_URL: http://localhost:10000
      run: npx playwright test smoke.spec.ts

    - name: Container log
      if: always()
      run: docker logs demo 2>&1 | tail -200

    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: tests/e2e/test-results
        retention-days: 7
