name: Deploy demo to Azure

# Manual-trigger only — click "Run workflow" in the Actions tab when you want to
# deploy the read-only demo. (No push trigger, so normal commits never deploy.)
#
# Needs in GitHub → Settings → Secrets and variables → Actions:
#   - variable AZURE_WEBAPP_NAME           : the App Service name (e.g. docflowhub-demo)
#   - secret   AZURE_WEBAPP_PUBLISH_PROFILE : the App Service publish profile (XML)
on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  DOTNET_VERSION: '10.0.x'
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then echo "::error::Set the repository variable AZURE_WEBAPP_NAME"; exit 1; fi
          if [ -z "$PUBLISH_PROFILE" ]; then echo "::error::Set the repository secret AZURE_WEBAPP_PUBLISH_PROFILE"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # wwwroot/lib (Bootstrap, jQuery, Chart.js…) is git-ignored; restore it from libman.json
      # so the published site has its styles and scripts.
      - name: Restore client libraries
        working-directory: src/DocFlowHub.Web
        env:
          DOTNET_ROLL_FORWARD: Major # the libman tool targets .NET 8; let it run on .NET 10
        run: |
          dotnet tool install --global Microsoft.Web.LibraryManager.Cli --version 3.0.71
          libman restore

      - name: Restore
        run: dotnet restore DocFlowHub.sln

      - name: Build
        run: dotnet build DocFlowHub.sln -c Release --no-restore

      - name: Test
        run: dotnet test DocFlowHub.sln -c Release --no-build --filter "Category!=LiveStorage"

      - name: Publish web app
        run: dotnet publish src/DocFlowHub.Web/DocFlowHub.Web.csproj -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Check published client libraries
        run: |
          for f in lib/bootstrap/css/bootstrap.min.css lib/bootstrap/js/bootstrap.bundle.min.js lib/jquery/dist/jquery.min.js lib/bootstrap-icons/font/bootstrap-icons.min.css; do
            test -f "${{ env.PUBLISH_DIR }}/wwwroot/$f" || { echo "::error::Missing wwwroot/$f in the publish output"; exit 1; }
          done

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

# On every start the app runs EF migrations and (because DemoMode__Enabled=true) seeds the
# demo dataset if it is missing. No AI key is configured, so AI generation is disabled by design.
